project:
  name: doxa-demo

data:
  dir: data
  beliefs: beliefs.jsonl
  quotes: quotes.jsonl
  sources: sources.jsonl

lens:
  name: public-domain-beliefs
  description: Extract durable claims about judgment, courage, liberty, and agency.
  question: What does this source believe people should understand or do?
  stances: [supports, questions, rejects, complicates]
  tags: [agency, judgment, liberty]

llm:
  provider: codex-cli

retrieval:
  default_search: keyword
  limit: 5
  candidate_limit: 50
  quote_boost: 2.0
  max_quotes_per_result: null

preferences:
  domains:
    general: 2
    research: 3
    technical: 3
    policy: 2
    creative: 2
