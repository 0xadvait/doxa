# doxa configuration example
#
# For most projects, prefer:
#   doxa init
#
# This file is a fuller annotated reference you can copy to doxa.yaml when you
# want to tune providers, fetchers, retrieval, domains, or semantic search.

project:
  name: my-belief-base

data:
  # JSONL is the source of truth. Paths are relative to this config file.
  dir: data
  beliefs: beliefs.jsonl
  quotes: quotes.jsonl
  sources: sources.jsonl

lens:
  # The lens defines what kind of beliefs the miner should extract.
  name: durable-beliefs
  description: Extract durable claims, values, and stances that the source explicitly supports.
  question: What does this source believe about how people should think, decide, or act?
  stances:
    - supports
    - questions
    - rejects
    - complicates
  tags:
    - epistemology
    - ethics
    - agency

llm:
  # Options: codex-cli, claude-cli, openai, openai-compatible, anthropic.
  provider: codex-cli
  # API providers use this unless their provider block overrides it.
  model: ""
  temperature: 0

providers:
  codex-cli:
    # Runs `codex exec` through argv with a bounded timeout.
    # Set unsafe_bypass: true only for trusted local workflows that explicitly
    # accept unattended agent execution risk.
    binary: codex
    flags:
      - exec
    output_flag: -o
    timeout: 300
    unsafe_bypass: false

  claude-cli:
    # Runs Claude Code through argv with a bounded timeout.
    binary: claude
    flags:
      - -p
      - "{prompt}"
      - --output-format
      - json
    timeout: 300

  openai:
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    base_url: ""

  openai-compatible:
    # Fireworks example:
    #   llm.provider: openai-compatible
    #   llm.model: accounts/fireworks/models/<slug>
    #   providers.openai-compatible.base_url: https://api.fireworks.ai/inference/v1
    #   providers.openai-compatible.api_key_env: FIREWORKS_API_KEY
    #
    # Local vLLM, llama.cpp, and Ollama-compatible servers can also live here.
    api_key_env: OPENAI_API_KEY
    model: ""
    base_url: ""

  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    model: claude-3-5-sonnet-latest

sources:
  # URL fetcher options: requests, jina, firecrawl, brightdata, command,
  # claude, codex, hermes. Override per ingest with `--via <name>`.
  fetcher: requests

  jina:
    api_key_env: JINA_API_KEY

  firecrawl:
    api_key_env: FIRECRAWL_API_KEY

  brightdata:
    api_token_env: BRIGHTDATA_API_TOKEN
    zone_env: BRIGHTDATA_ZONE

  command:
    # Prefer argv. It avoids a shell and can call any local scraper/MCP bridge.
    # Example:
    #   argv: ["my-scraper", "{url}"]
    timeout: 120
    # Shell mode is disabled unless allow_shell is true.
    allow_shell: false

  codex:
    timeout: 300
    unsafe_bypass: false

  hermes:
    timeout: 300
    unsafe_yolo: false

retrieval:
  # Keyword works with zero infrastructure. semantic/hybrid need embeddings+postgres.
  default_search: keyword
  limit: 5
  # Overfetch before final ranking so rare quote hits and domain boosts can surface.
  candidate_limit: 50
  # Quote document hits are folded back to linked beliefs with this multiplier.
  quote_boost: 2.0
  # Active domain aliases add a small candidate-discovery BM25 leg before slicing.
  # Set to 0, or pass --no-domain-boost, for literal keyword-only candidates.
  domain_query_boost: 0.25
  # Display cap; matched quote hits are shown before other linked quotes.
  max_quotes_per_result: null  # set an integer to cap displayed/returned quotes per belief
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60

preferences:
  # Domain weights run from 0 to 10. Matching domain:<slug> tags get a small
  # retrieval boost and are also shown to the mining prompt as tagging hints.
  domains:
    general: 2
    research: 3
    technical: 3
    policy: 2
    creative: 2
  # Aliases extend retrieval boosts to older plain tags without changing JSONL.
  domain_aliases:
    crypto: [token-economics, tokenomics, tokens, web3, blockchain, defi]
    startups: [startup, startups, founders, company-building]
    relationships: [trust, communication, friendship]
    creative: [design, taste, myths, religion, writing]

embeddings:
  # Used by doxa[embeddings] for semantic indexing.
  model: BAAI/bge-small-en-v1.5
  dimension: 384

postgres:
  # Set this env var before semantic indexing/search.
  dsn_env: DOXA_POSTGRES_DSN
  table_prefix: doxa
