# doxa configuration
#
# Copy this file to doxa.yaml with:
#   doxa init
#
# The default provider is codex-cli because it uses your existing Codex CLI auth
# and does not require a new API key. claude-cli behaves similarly for Claude
# Code users. API providers are available behind extras.

project:
  name: my-belief-base

data:
  # JSONL is the source of truth. These paths are relative to this config file.
  dir: data
  beliefs: beliefs.jsonl
  quotes: quotes.jsonl
  sources: sources.jsonl

lens:
  # The lens defines what kind of beliefs the miner should extract.
  name: durable-beliefs
  description: Extract durable claims, values, and stances that the source explicitly supports.
  question: What does this source believe about how people should think, decide, or act?
  stances:
    - supports
    - questions
    - rejects
    - complicates
  tags:
    - epistemology
    - ethics
    - agency

llm:
  # Options: codex-cli, claude-cli, openai, openai-compatible, anthropic.
  provider: codex-cli
  # API providers use this unless their provider block overrides it.
  model: ""
  temperature: 0

providers:
  codex-cli:
    # Runs: codex exec --dangerously-bypass-approvals-and-sandbox -o <tmp_result> -
    binary: codex
    flags:
      - exec
      - --dangerously-bypass-approvals-and-sandbox
    output_flag: -o

  claude-cli:
    # Runs: claude -p "<prompt>" --output-format json
    binary: claude
    flags:
      - -p
      - "{prompt}"
      - --output-format
      - json

  openai:
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    base_url: ""

  openai-compatible:
    # Fireworks example:
    #   llm.provider: openai-compatible
    #   llm.model: accounts/fireworks/models/<slug>
    #   providers.openai-compatible.base_url: https://api.fireworks.ai/inference/v1
    #   providers.openai-compatible.api_key_env: FIREWORKS_API_KEY
    #
    # Local vLLM, llama.cpp, and Ollama-compatible servers can also live here.
    api_key_env: OPENAI_API_KEY
    model: ""
    base_url: ""

  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    model: claude-3-5-sonnet-latest

sources:
  # URL fetcher options: requests, brightdata.
  # For agents with a BrightData MCP, prefer fetching there and piping text:
  #   printf '%s' "$FETCHED_MARKDOWN" | doxa ingest - --title "Title" --url "https://..."
  fetcher: requests
  brightdata:
    api_token_env: BRIGHTDATA_API_TOKEN
    zone_env: BRIGHTDATA_ZONE

retrieval:
  # keyword works with zero infrastructure. semantic needs embeddings+postgres.
  default_search: keyword
  limit: 5
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60

embeddings:
  # Used by doxa[embeddings] for semantic indexing.
  model: BAAI/bge-small-en-v1.5
  dimension: 384

postgres:
  # Set this env var before semantic indexing/search.
  dsn_env: DOXA_POSTGRES_DSN
  table_prefix: doxa
