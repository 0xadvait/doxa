<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">doxa — no quote, no claim</title>
  <desc id="desc">A clean GitHub README banner for doxa: custom knowledge bases for agents, grounded in verbatim quotes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .title { fill: #f8fafc; font-weight: 800; letter-spacing: -0.055em; }
      .text { fill: #cbd5e1; }
      .muted { fill: #94a3b8; }
      .line { stroke: #334155; stroke-width: 1; }
      .hairline { stroke: #64748b; stroke-opacity: .22; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="998" cy="82" r="210" fill="#7dd3fc" opacity="0.09" filter="url(#soft)"/>
  <circle cx="392" cy="330" r="230" fill="#fb7185" opacity="0.07" filter="url(#soft)"/>
  <path d="M64 64H1216" class="hairline"/>
  <path d="M64 356H1216" class="hairline"/>

  <g transform="translate(84 82)">
    <text class="mono muted" x="0" y="0" font-size="15" letter-spacing="0.22em">CUSTOM KNOWLEDGE BASES FOR AGENTS</text>
    <text class="sans title" x="0" y="94" font-size="104">doxa</text>
    <rect x="8" y="118" width="384" height="4" rx="2" fill="url(#accent)"/>
    <text class="sans text" x="0" y="166" font-size="30">Turn trusted sources into queryable beliefs.</text>
    <text class="sans muted" x="0" y="207" font-size="23">Every answer is pinned to a verbatim quote.</text>

    <g transform="translate(0 244)">
      <rect x="0" y="0" width="304" height="44" rx="22" fill="#111827" stroke="#334155"/>
      <circle cx="24" cy="22" r="5" fill="#7dd3fc"/>
      <text class="mono text" x="44" y="28" font-size="15">keyword · semantic · hybrid</text>
    </g>
    <g transform="translate(324 244)">
      <rect x="0" y="0" width="236" height="44" rx="22" fill="#111827" stroke="#334155"/>
      <circle cx="24" cy="22" r="5" fill="#fb7185"/>
      <text class="mono text" x="44" y="28" font-size="15">local JSONL store</text>
    </g>
  </g>

  <g transform="translate(720 96)">
    <rect x="0" y="0" width="472" height="228" rx="16" fill="#0b1220" stroke="#334155"/>
    <rect x="0" y="0" width="472" height="38" rx="16" fill="#111827"/>
    <circle cx="24" cy="19" r="5" fill="#fb7185"/>
    <circle cx="44" cy="19" r="5" fill="#fbbf24"/>
    <circle cx="64" cy="19" r="5" fill="#34d399"/>
    <text class="mono muted" x="92" y="24" font-size="13">doxa query</text>

    <text class="mono" x="28" y="75" font-size="18" fill="#7dd3fc">$ doxa query "what should I trust?"</text>
    <text class="mono text" x="28" y="112" font-size="16">belief: self-trust requires evidence</text>
    <text class="mono muted" x="28" y="144" font-size="16">source: essay / transcript / note</text>
    <text class="mono" x="28" y="176" font-size="16" fill="#fbbf24">quote: "...exact words from the source..."</text>
    <path d="M28 204H444" class="line"/>
  </g>

  <g transform="translate(720 344)">
    <rect x="0" y="-33" width="472" height="52" rx="26" fill="#0f172a" stroke="url(#accent)" stroke-width="1.5"/>
    <text class="mono" x="236" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.16em">NO QUOTE // NO CLAIM</text>
  </g>
</svg>
