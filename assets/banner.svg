<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Doxa belief oracle banner</title>
  <desc id="desc">A colored neo-industrial oracle banner for doxa with the branding NO QUOTE // NO CLAIM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080a"/>
      <stop offset="0.36" stop-color="#0d1718"/>
      <stop offset="0.7" stop-color="#12100f"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="oracleGlow" cx="50%" cy="47%" r="48%">
      <stop offset="0" stop-color="#74fff1" stop-opacity="0.42"/>
      <stop offset="0.34" stop-color="#ffb84d" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#0a0d0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="260" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e7bf"/>
      <stop offset="0.52" stop-color="#9ffcf1"/>
      <stop offset="1" stop-color="#ff6d8f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2d30"/>
      <stop offset="0.5" stop-color="#4a3830"/>
      <stop offset="1" stop-color="#162427"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ceee2" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cream { fill: #f8e7bf; }
      .cyan { fill: #80fff1; }
      .pink { fill: #ff6d8f; }
      .amber { fill: #ffbd5a; }
      .muted { fill: #8ca4a5; }
      .line-cyan { stroke: #80fff1; }
      .line-amber { stroke: #ffbd5a; }
      .line-pink { stroke: #ff6d8f; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="160" y="54" width="960" height="520" fill="url(#oracleGlow)"/>
  <path d="M76 54H1204L1240 90V550L1204 586H76L40 550V90Z" fill="none" stroke="#80fff1" stroke-opacity="0.34" stroke-width="2"/>
  <path d="M100 82H1180L1208 110V530L1180 558H100L72 530V110Z" fill="none" stroke="#f8e7bf" stroke-opacity="0.18" stroke-width="1.5"/>

  <g opacity="0.34">
    <path d="M118 160H314M966 160H1162M118 480H314M966 480H1162" stroke="#ffbd5a" stroke-width="2"/>
    <path d="M170 104V536M1110 104V536" stroke="#80fff1" stroke-width="1"/>
    <circle cx="170" cy="132" r="5" fill="#ff6d8f"/>
    <circle cx="170" cy="508" r="5" fill="#ff6d8f"/>
    <circle cx="1110" cy="132" r="5" fill="#ff6d8f"/>
    <circle cx="1110" cy="508" r="5" fill="#ff6d8f"/>
  </g>

  <g class="mono" font-size="17" letter-spacing="2">
    <text x="94" y="124" class="cyan">SOURCE: VERBATIM</text>
    <text x="94" y="154" class="muted">belief == claim + receipts</text>
    <text x="94" y="184" class="amber">store: jsonl</text>
    <text x="94" y="214" class="muted">lens: custom</text>
    <text x="958" y="124" class="pink">SEARCH: HYBRID</text>
    <text x="958" y="154" class="muted">keyword / semantic</text>
    <text x="958" y="184" class="amber">quote hit folds back</text>
    <text x="958" y="214" class="muted">answer carries source</text>
  </g>

  <g transform="translate(640 318)" filter="url(#softGlow)">
    <path d="M0 -176L154 -88V88L0 176L-154 88V-88Z" fill="#101719" stroke="#80fff1" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M0 -136L118 -68V68L0 136L-118 68V-68Z" fill="#080b0d" stroke="#ffbd5a" stroke-opacity="0.58" stroke-width="2"/>
    <path d="M-178 0H-118M118 0H178M0 -208V-136M0 136V208" stroke="#ff6d8f" stroke-opacity="0.64" stroke-width="3"/>
    <circle cx="0" cy="0" r="82" fill="#0c1113" stroke="#f8e7bf" stroke-opacity="0.58" stroke-width="3"/>
    <path d="M-92 0C-50 -52 50 -52 92 0C50 52 -50 52 -92 0Z" fill="#102426" stroke="#80fff1" stroke-width="3"/>
    <circle cx="0" cy="0" r="27" fill="#ffbd5a"/>
    <circle cx="0" cy="0" r="12" fill="#080b0d"/>
    <path d="M0 -28L16 14H-16Z" fill="#ff6d8f" opacity="0.85"/>
  </g>

  <text x="640" y="292" text-anchor="middle" class="sans" font-size="146" font-weight="900" letter-spacing="16" fill="url(#titleFill)">DOXA</text>
  <text x="640" y="337" text-anchor="middle" class="mono cream" font-size="23" letter-spacing="7">BELIEF ORACLE</text>
  <text x="640" y="374" text-anchor="middle" class="mono muted" font-size="18">quote-first knowledge for agents</text>

  <g>
    <path d="M303 420H977L1000 444L977 492H303L280 444Z" fill="#080b0d" stroke="#ffbd5a" stroke-opacity="0.78" stroke-width="2"/>
    <path d="M320 432H960" stroke="#80fff1" stroke-opacity="0.34" stroke-width="1"/>
    <text x="640" y="470" text-anchor="middle" class="mono pink" font-size="41" font-weight="800" letter-spacing="4">NO QUOTE // NO CLAIM</text>
  </g>

  <g class="mono" font-size="14" letter-spacing="1">
    <text x="365" y="520" class="amber">unsourced prophecy stays dark</text>
    <text x="640" y="520" text-anchor="middle" class="muted">evidence rises like signal</text>
    <text x="915" y="520" text-anchor="end" class="cyan">DOXA keeps the oracle honest</text>
  </g>

  <g class="mono" font-size="13" opacity="0.78">
    <text x="90" y="566" class="muted">╭──────── oracle membrane ────────╮</text>
    <text x="982" y="566" class="muted">╰────── evidence or silence ─────╯</text>
  </g>
</svg>
