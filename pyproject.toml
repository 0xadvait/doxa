[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doxa"
version = "0.1.0"
description = "Build and query verbatim-grounded belief bases -- every answer pinned to an exact source quote."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "doxa contributors"}]
keywords = ["agent", "agent-skill", "beliefs", "retrieval", "quotes", "rag", "knowledge-base", "grounded-ai", "citation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.8.0"]
postgres = ["psycopg2-binary>=2.9.12", "pgvector>=0.4.2"]
pdf = ["pymupdf>=1.27.2.3"]
youtube = ["yt-dlp>=2026.3.17"]
openai = ["openai>=2.38.0"]
anthropic = ["anthropic>=0.104.1"]
all = [
  "fastembed>=0.8.0",
  "psycopg2-binary>=2.9.12",
  "pgvector>=0.4.2",
  "pymupdf>=1.27.2.3",
  "yt-dlp>=2026.3.17",
  "openai>=2.38.0",
  "anthropic>=0.104.1",
]

[project.scripts]
doxa = "doxa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doxa*"]

[tool.setuptools.package-data]
doxa = [
  "_assets/**/*.jsonl",
  "_assets/**/*.md",
  "_assets/**/*.txt",
  "_assets/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
